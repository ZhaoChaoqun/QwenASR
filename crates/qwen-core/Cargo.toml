[package]
name = "qwen-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared core modules for Qwen model inference (config, tokenizer, decoder, kernels, etc.)"

[dependencies]
libc = "0.2"
candle-core = { version = "0.9", optional = true, features = ["metal"] }
candle-metal-kernels = { version = "0.9.2", optional = true }

[features]
default = ["blas", "vdsp"]
blas = []
vdsp = []
metal = ["dep:candle-core", "dep:candle-metal-kernels"]
